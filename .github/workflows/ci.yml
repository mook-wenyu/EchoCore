# CI 工作流：dsh-memory 包的持续集成
# 在 push 与 pull_request（main/master 与任意分支）时触发。
name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches:
      - main
      - master
      - '**'

jobs:
  build-and-test:
    # 使用最新 Ubuntu 运行器
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 安装/缓存 pnpm（v4 action 读取 package.json 的 packageManager 字段——
      #    单一事实源；此前显式 version:11 与 packageManager 双声明冲突致 CI 早夭）
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 3. 安装 Node 22，并配置 pnpm 依赖缓存（cache: 'pnpm' 复用 store 加速安装）
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 4. 按 lockfile 精确安装依赖（frozen-lockfile 保证 CI 与本地锁定版本一致）
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 5. 仅对 dsh-memory 包执行 TypeScript 类型检查
      - name: 类型检查
        run: pnpm --filter @echocore/dsh-memory typecheck

      # 6. 运行 dsh-memory 包测试
      - name: 运行测试
        run: pnpm --filter @echocore/dsh-memory test

      # 7. 覆盖率门槛（Q6，2026-08-17）：阈值在 vitest.config.ts coverage.thresholds
      #    （lines80/functions75/statements80/branches70——据实测基线
      #    Stmts93.9/Branch90.8/Funcs94 各留 ~10pt 余量，防 CI 红）。
      - name: 覆盖率门槛
        run: pnpm --filter @echocore/dsh-memory test:coverage

      # 8. 文档校验 —— docs-as-code（2026-08-18）：断链 + 中英标题一致性/语言条
      #    （scripts/check-docs.mjs，零依赖；相对 .md 链接断链即失败、zh 漏翻整节即失败）。
      - name: 文档断链与中英一致性
        run: node scripts/check-docs.mjs

      # 9. markdownlint（markdownlint-cli2，根 devDep；配置 .markdownlint-cli2.jsonc——
      #    关 MD013/024/033/034/036/040/041/060 噪声规则，其余结构规则强制）。
      - name: markdownlint
        run: pnpm exec markdownlint-cli2
